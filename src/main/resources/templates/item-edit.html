<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Item Completo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .full-width {
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h1>Editar Producto Completo</h1>
    <form th:action="@{/items/edit}" th:object="${item}" method="post">

        <input type="hidden" th:field="*{_id}">
        <input type="hidden" th:field="*{itemId}">

        <div class="form-grid">
            <div class="form-group">
                <label>Título:</label>
                <input type="text" th:field="*{title}" required>
            </div>

            <div class="form-group">
                <label>Categoría:</label>
                <input type="text" th:field="*{category}">
            </div>

            <div class="form-group">
                <label>Precio (€):</label>
                <input type="number" step="0.01" th:field="*{price}" required>
            </div>

            <div class="form-group">
                <label>Stock (Cantidad):</label>
                <input type="number" th:field="*{count}" required>
            </div>

            <div class="form-group">
                <label>Fabricante:</label>
                <input type="text" th:field="*{manufacturer}">
            </div>

            <div class="form-group">
                <label>Color:</label>
                <input type="text" th:field="*{color}">
            </div>

            <div class="form-group">
                <label>EAN (Código de barras):</label>
                <input type="text" th:field="*{ean}">
            </div>

            <div class="form-group">
                <label>Puntuación (Rate):</label>
                <input type="number" step="0.1" min="0" max="5" th:field="*{rate}">
            </div>

            <div class="form-group full-width">
                <label>URL de la Imagen:</label>
                <input type="text" th:field="*{image}">
            </div>

            <div class="form-group full-width">
                <label>Descripción:</label>
                <textarea th:field="*{description}" rows="4"></textarea>
            </div>
        </div>

        <div class="actions" style="margin-top: 20px;">
            <button type="submit" class="btn btn-save">Guardar Cambios</button>
            <a th:href="@{/items}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
